name: AccuKnox Secret Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: Vickydew1/secret-scan-action-new@main
        with:
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: cspm.demo.accuknox.com
          accuknox_label: GVD
          soft_fail: true
