name: AccuKnox Secret Scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Run AccuKnox Secret Scan
        id: accuknox
        continue-on-error: true
        uses: VanishaParwal/secret-scan-action-new@main
        with:
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_label: "newsecret"
          additional_arguments: "--log-level=debug"
          upload_results: "true"
          soft_fail: "true"
