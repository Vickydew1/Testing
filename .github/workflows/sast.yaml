name: Accuknox SAST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  accuknox-cicd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: "Run Accuknox SAST: Opengrep"
        uses: accuknox/sast-scan-opengrep-action@latest
        with:
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_label: ${{ secrets.ACCUKNOX_LABEL }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          accuknox_ai_analysis: "false"
          soft_fail: "true"
          severity: "HIGH"

      - name: Install and run OCR quality check
        if: github.event_name == 'pull_request'
        run: |
          npm install -g @alibaba-group/open-code-review
          ocr config set llm.url https://openrouter.ai/api/v1/chat/completions
          ocr config set llm.auth_token ${{ secrets.OPENROUTER_API_KEY }}
          ocr config set llm.model anthropic/claude-sonnet-4.5
          ocr review --from ${{ github.event.pull_request.base.sha }} --to ${{ github.sha }} --format json > ocr_output.json

      - name: Get changed files
        if: github.event_name == 'pull_request'
        id: diff
        run: |
          FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | tr '\n' ',' | sed 's/,$//')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Changed files: $FILES"\
          
      - name: Locate result file
        if: github.event_name == 'pull_request'
        id: findfile
        run: |
          FOUND=$(find . -maxdepth 2 \( -name "results*.json" -o -name "*sast*.json" \) 2>/dev/null | head -1)
          echo "path=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Found result file: $FOUND"
          python3 .accuknox/pr-decorator/merge_ocr_findings.py "$FOUND" ocr_output.json "$FOUND"

      - name: Generate remediation
        if: github.event_name == 'pull_request'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 .accuknox/pr-decorator/generate_remediation.py "${{ steps.findfile.outputs.path }}" enriched.json \
            --changed-files="${{ steps.diff.outputs.files }}"

      - name: Post PR Decorator review
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 .accuknox/pr-decorator/post_pr_review.py enriched.json \
            --changed-files="${{ steps.diff.outputs.files }}" \
            --mode=advisory
