name: AccuKnox PR Decorator (demo)

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  scan-and-decorate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AccuKnox scan + PR Decorator
        uses: Vickydew1/Accuknox-Code-Analysis@add-pr-decorator
        with:
          scan_type: sast,iac,secret
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_label: ${{ secrets.ACCUKNOX_LABEL }}
          soft_fail: "true"
          pr_decorator: "true"
          # llm_api_key omitted for the demo - OPENROUTER_API_KEY in this
          # repo isn't a valid key (401s), and remediation isn't needed to
          # show the core feature. Re-add once that secret is fixed.
