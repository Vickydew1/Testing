name: AccuKnox PR Decorator (demo)

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  scan-and-decorate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Posts the review as your GitHub App bot. Falls back to the default
      # github-actions[bot] token if the App secrets are not set yet.
      - name: Get bot token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run AccuKnox scan + PR Decorator
        uses: Vickydew1/Accuknox-Code-Analysis@add-pr-decorator
        with:
          scan_type: sast,sca,iac,secret,quality
          accuknox_endpoint: ${{ secrets.ACCUKNOX_ENDPOINT }}
          accuknox_token: ${{ secrets.ACCUKNOX_TOKEN }}
          accuknox_label: ${{ secrets.ACCUKNOX_LABEL }}
          soft_fail: "true"
          pr_decorator: "true"
          github_token: ${{ steps.app-token.outputs.token || github.token }}
